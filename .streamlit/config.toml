[theme]
base = "light"
primaryColor = "#B5442C"
backgroundColor = "#FAF7F2"
secondaryBackgroundColor = "#F2ECE3"
textColor = "#221E1A"
borderColor = "#E4DACB"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&display=swap"
baseRadius = "0.5rem"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 20

[browser]
gatherUsageStats = false
