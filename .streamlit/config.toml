[theme]
base = "light"
primaryColor = "#D62718"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F2EF"
textColor = "#111111"
borderColor = "#CFCFCA"
font = "Libre Franklin:https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800;900&display=swap"
headingFont = "Libre Franklin:https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800;900&display=swap"
baseRadius = "none"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 20

[browser]
gatherUsageStats = false
